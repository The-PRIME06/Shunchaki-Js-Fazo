<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Kirish</title>
  <style>
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    @media (max-width: 497px) {
      .login-card {
        width: 371px;
        /* padding: 20px; */
      }
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #4a00e0, #8e2de2);
      overflow: hidden;
      position: relative;
    }

    /* Fon bezaklari (Doiralar) */
    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      z-index: 1;
    }
    .shape-1 {
      width: 300px;
      height: 300px;
      background: #ff007f;
      top: -50px;
      left: -50px;
    }
    .shape-2 {
      width: 350px;
      height: 350px;
      background: #00d2ff;
      bottom: -80px;
      right: -80px;
    }

    /* Karta (Glassmorphism) */
    .login-card {
      position: relative;
      z-index: 10;
      width: 400px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      color: #ffffff;
    }

    .login-card h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    /* Kiritish maydonlari */
    .input-box {
      position: relative;
      margin-bottom: 25px;
    }

    .input-box input {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      outline: none;
      color: #fff;
      font-size: 1rem;
      transition: 0.3s ease;
    }

    .input-box input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .input-box input:focus {
      background: rgba(255, 255, 255, 0.25);
      border-color: #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    /* Esda saqlash va Parolni tiklash */
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 25px;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .options a {
      color: #fff;
      text-decoration: none;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .options a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* Tugma */
    .btn {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      color: #4a00e0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    .btn:hover {
      background: #f0f0f0;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Ro'yxatdan o'tish havolasi */
    .register-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
    }

    .register-link a {
      color: #fff;
      font-weight: bold;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Fon effekti uchun shakllar -->
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>

  <!-- Login formasi -->
  <div class="login-card">
    <h2>Xush kelibsiz!</h2>
    <form action="#">
      <div class="input-box">
        <input type="email" placeholder="Email manzil" required>
      </div>
      <div class="input-box">
        <input type="password" placeholder="Parol" required>
      </div>

      <div class="options">
        <label>
          <input type="checkbox" required> Eslab qolish
        </label>
        <a href="#">Parolni unutdingizmi?</a>
      </div>

      <button type="submit" class="btn" onclick="window.location.href='./index.html'">Kirish</button>

      <div class="register-link">
        <p>Hisobingiz yo'qmi? <a href="#">Ro'yxatdan o'ting</a></p>
      </div>
    </form>
  </div>

</body>
</html>
